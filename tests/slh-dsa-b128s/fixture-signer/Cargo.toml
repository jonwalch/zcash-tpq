[package]
name = "slh-dsa-b128s-public-fixture"
version = "0.1.0"
edition = "2024"
publish = false
license = "MIT OR Apache-2.0"

# Upstream signing APIs use a different RustCrypto dependency generation from
# Zakura. This test-only process has its own workspace and lock file.
[workspace]

[dependencies]
slh-dsa = { git = "https://github.com/PQC-Suite-B/signatures", rev = "b392fe82d2d9770142477a576a758a233888bc0a", features = ["zeroize"] }
blake3 = "=1.8.5"
zakura-pq-slh-dsa-b-verify = { path = "../../../crates/pq-slh-dsa-b-verify" }
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
hex = "=0.4.3"

[profile.dev]
opt-level = 3
