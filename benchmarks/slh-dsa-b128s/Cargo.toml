[package]
name = "tpq-bench"
version = "0.1.0"
edition = "2021"
rust-version = "1.97"
publish = false
license = "MIT OR Apache-2.0"
description = "Explicitly invoked SLH-DSA-B-128s primitive measurements"

# A separate executable and lock file keep measurement dependencies out of nodes.
[workspace]

[dependencies]
zakura-pq-slh-dsa-b-sign = { path = "../../crates/pq-slh-dsa-b-sign" }
zakura-pq-slh-dsa-b-verify = { path = "../../crates/pq-slh-dsa-b-verify" }
blake3 = { version = "=1.8.5", default-features = false, features = ["std"] }
libc = "=0.2.186"
serde_json = "=1.0.150"
zeroize = "=1.9.0"

[dev-dependencies]
hex = "=0.4.3"

[lints.rust]
unsafe_op_in_unsafe_fn = "deny"

