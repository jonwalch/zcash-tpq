[package]
name = "zakura-pq-wallet"
version = "0.1.0"
edition = "2021"
rust-version = "1.97"
license = "MIT OR Apache-2.0"
publish = false
description = "Experimental SLH wallet key foundation"

[features]
default = []
experimental-slh-dsa-b128s = ["dep:zakura-pq-slh-dsa-b-sign", "dep:hkdf", "dep:sha2", "dep:rand_core", "dep:zeroize"]

[dependencies]
zakura-pq-slh-dsa-b-sign = { path = "../pq-slh-dsa-b-sign", optional = true }
hkdf = { version = "=0.12.4", optional = true }
sha2 = { version = "0.10", optional = true }
rand_core = { version = "=0.6.4", features = ["getrandom"], optional = true }
zeroize = { version = "=1.9.0", optional = true }

[dev-dependencies]
serde_json = "1.0"
hex = "=0.4.3"

[lints]
workspace = true
