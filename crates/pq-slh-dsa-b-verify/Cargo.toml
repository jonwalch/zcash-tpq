[package]
name = "zakura-pq-slh-dsa-b-verify"
version = "0.1.0"
edition = "2021"
license = "MIT OR Apache-2.0"
publish = false
description = "Fixed-profile experimental SLH-DSA-B-128s verification"

[dependencies]
blake3 = { version = "=1.8.5", default-features = false, features = ["std"] }

[dev-dependencies]
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"

[lints]
workspace = true
