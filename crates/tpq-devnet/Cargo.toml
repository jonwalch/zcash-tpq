[package]
name = "zakura-tpq-devnet"
version = "0.1.0"
edition.workspace = true
license.workspace = true
rust-version.workspace = true
publish = false

[[bin]]
name = "tpq-devnet"
path = "src/main.rs"
required-features = ["wallet"]

[[bin]]
name = "zdn-tpq-adapter"
path = "src/adapter_main.rs"
required-features = ["adapter"]

[[bin]]
name = "zdn-tpq-import"
path = "src/import_main.rs"
required-features = ["adapter"]

[features]
default = ["wallet"]
wallet = ["zakura-pq-wallet/experimental-slh-dsa-b128s", "dep:secp256k1", "dep:sha2", "dep:ripemd", "dep:base64", "dep:toml"]
adapter = ["dep:sha2", "dep:toml"]

[dependencies]
zakura-chain = { path = "../zakura-chain" }
zakura-pq-wallet = { path = "../pq-wallet", default-features = false, features = ["public-profile"] }
serde = { workspace = true, features = ["derive"] }
serde_json = { workspace = true, features = ["raw_value"] }
hex.workspace = true
secp256k1 = { workspace = true, optional = true }
sha2 = { workspace = true, optional = true }
ripemd = { workspace = true, optional = true }
base64 = { workspace = true, optional = true }
toml = { workspace = true, features = ["display"], optional = true }

[dev-dependencies]
tempfile.workspace = true
zakura-network = { path = "../zakura-network" }
