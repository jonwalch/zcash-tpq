[package]
name = "zakura-tpq-devnet"
version = "0.1.0"
edition.workspace = true
license.workspace = true
rust-version.workspace = true
publish = false

[[bin]]
name = "tpq-devnet"
path = "src/main.rs"

[dependencies]
zakura-chain = { path = "../zakura-chain" }
zakura-pq-wallet = { path = "../pq-wallet", features = ["experimental-slh-dsa-b128s"] }
serde = { workspace = true, features = ["derive"] }
serde_json.workspace = true
hex.workspace = true
secp256k1.workspace = true
sha2.workspace = true
ripemd.workspace = true
base64.workspace = true
toml = { workspace = true, features = ["display"] }

[dev-dependencies]
tempfile.workspace = true
zakura-network = { path = "../zakura-network" }
