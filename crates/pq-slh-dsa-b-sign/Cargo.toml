[package]
name = "zakura-pq-slh-dsa-b-sign"
version = "0.1.0"
edition = "2021"
rust-version = "1.97"
license = "MIT OR Apache-2.0"
publish = false
description = "Fixed-profile experimental SLH-DSA-B-128s wallet signing"

[dependencies]
zakura-pq-slh-dsa-b-verify = { path = "../pq-slh-dsa-b-verify" }
blake3 = { version = "=1.8.5", default-features = false, features = ["std", "zeroize"] }
zeroize = "=1.9.0"
rand_core = { version = "=0.6.4", features = ["getrandom"] }

[dev-dependencies]
serde_json = "1.0"
hex = "=0.4.3"

[lints]
workspace = true
