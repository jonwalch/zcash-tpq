[package]
name = "zakura-pq-cli"
version = "0.1.0"
publish = false
edition = "2021"
rust-version = "1.97"
license = "MIT OR Apache-2.0"
description = "Explicitly approved experimental SLH Regtest wallet commands"

[[bin]]
name = "pq-wallet"
path = "src/main.rs"

[features]
default = []
experimental-slh-dsa-b128s = ["dep:zakura-pq-wallet", "zakura-pq-wallet/experimental-slh-dsa-b128s", "dep:zakura-pq-slh-dsa-b-exp", "dep:zeroize", "dep:hex", "dep:serde", "dep:serde_json", "dep:sha2", "dep:rustix"]

[dependencies]
zakura-pq-wallet = { path = "../pq-wallet", optional = true }
zakura-pq-slh-dsa-b-exp = { path = "../pq-slh-dsa-b-exp", optional = true }
zeroize = { version = "=1.9.0", optional = true }
hex = { version = "=0.4.3", optional = true }
serde = { version = "=1.0.228", features = ["derive"], optional = true }
serde_json = { version = "=1.0.150", optional = true }
sha2 = { version = "0.10", optional = true }

[target.'cfg(unix)'.dependencies]
rustix = { version = "=1.1.4", features = ["termios"], optional = true }

[dev-dependencies]
tempfile = "=3.27.0"

[lints]
workspace = true
